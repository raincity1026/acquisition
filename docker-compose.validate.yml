# 验证阶段临时覆盖层：备案前把前端额外暴露到高位端口 8080 对外验证用。
# 大陆云（腾讯云）未备案时 80/443 公网访问会被拦截，高位端口通常可用（需在安全组放行 8080）。
# 用法：docker compose --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.validate.yml up -d --build
# 备案通过后：去掉本文件、改用 80/443，再签 HTTPS 证书。
services:
  web:
    ports:
      - "8080:80" # 浏览器开 http://服务器IP:8080；nginx 容器内仍听 80，/api 照常反代给后端
