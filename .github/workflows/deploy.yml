name: Deploy

# push 到 main：SSH 到服务器，git 拉最新 + 本地构建镜像 + 起容器。
# 为何在服务器构建：GitHub runner 跨境传字节进中国会卡死(scp/TCR push 都验证过)；
# 服务器从阿里源(域内)单流拉依赖是唯一稳的路。首次构建后层缓存留本机，后续秒级。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true # 新部署自动取消正在跑的旧部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到服务器构建并部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m # 首次全量构建留余量；有缓存后只需几十秒
          script: |
            set -e
            cd ~/acquisition
            git fetch origin main
            git reset --hard origin/main   # 与远程一致；不动 .env.prod 等未跟踪文件
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
