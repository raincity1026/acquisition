name: Deploy

# push 到 main：SSH 到服务器，git 拉最新 + 本地构建镜像 + 起容器。
# （国内部署：镜像在服务器本地构建，不跨境推拉，依赖走腾讯内网源）
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true # 新部署自动取消正在跑的旧部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到服务器构建并部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 25m # 后端镜像本地构建（pandas 等）给足时间
          script: |
            set -e
            cd ~/acquisition
            git fetch origin main
            git reset --hard origin/main   # 与远程一致；不动 .env.prod 等未跟踪文件
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
