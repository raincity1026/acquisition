[project]
name = "marsian-acquisition"
version = "0.1.0"
description = "盘后 A 股复盘工具 — 后端 (M0 数据链)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "baostock>=0.8.9",
    "akshare>=1.18",
    "pandas>=2.2",
    "pyjwt>=2.10",
    "pwdlib[bcrypt]>=0.2.1",
    "email-validator>=2.2",
    "apscheduler>=3.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]  # alembic 约定：config 初始化后再 import

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# baostock / akshare 无类型存根，单独放行
[[tool.mypy.overrides]]
module = ["baostock.*", "akshare.*", "pandas.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 触网的集成测试(真实调用 Baostock/AKShare)，默认随单测一起跑",
]
