# 生产部署：服务器跑 后端(FastAPI+APScheduler) + PostgreSQL + nginx(API网关)。
# 前端在腾讯云 EdgeOne(stocks.marsian.cn)，不在这里；nginx 只反代 api.stocks.marsian.cn。
# 用法：docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# 后端镜像由 CI 推 TCR、服务器 pull 后 retag 成本地名，这里不再 --build。
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data # 数据持久化，重启不丢
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: acquisition-backend:latest # CI 推 TCR、服务器 pull 后 retag 成此名
    pull_policy: never # 本地已 load，禁止 compose 去仓库拉
    restart: unless-stopped
    env_file: .env.prod # DATABASE_URL / JWT_SECRET 等敏感配置（仅服务器，不入库）
    environment:
      # 非敏感配置放这里版本化管理：改前端域名只需改这行 + push，不用上服务器。
      # 多个来源用逗号分隔。environment 优先级高于 env_file。
      CORS_ORIGINS: https://stocks.marsian.cn
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro # ACME 验证
      - ./certbot/conf:/etc/letsencrypt:ro # 证书（签发后）

volumes:
  pgdata:
